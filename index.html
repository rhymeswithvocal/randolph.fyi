<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>randolph.fyi</title>
  <meta name="description" content="A hosting site for Randolph neighborhood projects and civic engagement.">
  <style>
    :root {
      --bg: #f7f5f0;
      --fg: #1c1c1a;
      --muted: #5f5e58;
      --accent: #1f5f4a;
      --accent-fg: #fff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161614;
        --fg: #f0eee8;
        --muted: #a5a39a;
        --accent: #6fcaa8;
        --accent-fg: #10231c;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    main { max-width: 36rem; text-align: center; }
    h1 { font-size: clamp(2rem, 6vw, 3rem); margin: 0 0 0.5rem; letter-spacing: -0.02em; }
    p { font-size: 1.15rem; color: var(--muted); margin: 0 0 2rem; }
    a.button {
      display: inline-block;
      padding: 0.8rem 1.6rem;
      border-radius: 8px;
      background: var(--accent);
      color: var(--accent-fg);
      font-weight: 600;
      text-decoration: none;
    }
    a.button:hover, a.button:focus-visible { opacity: 0.88; }
  </style>
</head>
<body>
  <main>
    <h1>randolph.fyi</h1>
    <p>A hosting site for Randolph neighborhood projects and civic engagement.</p>
    <a class="button" href="/traffic/">Street Safety Survey (closes Nov 1) &rarr;</a>
  </main>
</body>
</html>
